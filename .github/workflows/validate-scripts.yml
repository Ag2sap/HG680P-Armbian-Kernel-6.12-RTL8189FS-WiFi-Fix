name: Validate installer scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/build.sh
          bash -n scripts/install-module.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/diagnose.sh
      - name: Run ShellCheck
        run: shellcheck install.sh scripts/build.sh scripts/install-module.sh scripts/uninstall.sh scripts/diagnose.sh
